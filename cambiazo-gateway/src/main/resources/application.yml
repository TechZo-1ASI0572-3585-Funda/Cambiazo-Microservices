spring:
  main:
    allow-bean-definition-overriding: true
  application:
    name: cmbz-gateway
  config:
    import: optional:configserver:http://config-server:8080
  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowed-origins:
              - "http://localhost:4200"
            allowed-methods:
              - "*"
            allowed-headers:
              - "*"
            allow-credentials: true

