server:
  port: 8082

spring:
  main:
    allow-bean-definition-overriding: true
  application:
    name: cmbz-product
  config:
    import: optional:configserver:http://config-server:8080

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://mysql:3306/productDb?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: cambiazo
    password: cambiazo123

  jpa:
    hibernate:
      ddl-auto: update
      naming:
        physical-strategy: com.cambiazo.product.shared.infrastructure.strategy.SnakeCaseWithPluralizedTablePhysicalNamingStrategy
    database: mysql
    database-platform: org.hibernate.dialect.MySQL8Dialect
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true

eureka:
  instance:
    hostname: product
    prefer-ip-address: true
    instance-id: product
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://eureka:8080/eureka/
