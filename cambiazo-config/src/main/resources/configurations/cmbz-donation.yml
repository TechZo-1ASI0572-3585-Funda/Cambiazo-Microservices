spring:
  application:
    name: cmbz-donation
  config:
    import: optional:configserver:http://config-server:8080

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://mservices-cambiazo.mysql.database.azure.com:3306/donationDb?sslMode=REQUIRED&useSSL=true&allowPublicKeyRetrieval=true
    username: cambiazo
    password: Techzo123

  jpa:
    hibernate:
      ddl-auto: update
      naming:
        physical-strategy: com.cambiazo.donation.shared.infrastructure.strategy.SnakeCaseWithPluralizedTablePhysicalNamingStrategy
    database: mysql
    database-platform: org.hibernate.dialect.MySQL8Dialect
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true

eureka:
  instance:
    hostname: donation
    prefer-ip-address: true
    instance-id: donation

  client:
    service-url:
      defaultZone: http://eureka:8080/eureka/
