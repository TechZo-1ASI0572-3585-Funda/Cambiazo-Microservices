spring:
  application:
    name: cmbz-exchange
  config:
    import: optional:configserver:https://cmbz-microservices-d5g5frgpafdbh9eb.westus-01.azurewebsites.net

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://mservices-cambiazo.mysql.database.azure.com:3306/exchangeDb?sslMode=REQUIRED&useSSL=true&allowPublicKeyRetrieval=true
    username: cambiazo
    password: Techzo123

  jpa:
    hibernate:
      ddl-auto: update
      naming:
        physical-strategy: com.cambiazo.exchange.shared.infrastructure.strategy.SnakeCaseWithPluralizedTablePhysicalNamingStrategy
    database: mysql
    database-platform: org.hibernate.dialect.MySQL8Dialect
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true

eureka:
  instance:
    hostname: cmbz-exchange.azurewebsites.net
    prefer-ip-address: false
    instance-id: cmbz-exchange.azurewebsites.net

  client:
    service-url:
      defaultZone: https://cmbz-eureka.azurewebsites.net/eureka/
