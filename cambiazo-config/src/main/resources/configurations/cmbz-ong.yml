server:
  port: 8060

spring:
  application:
    name: cmbz-ong
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/ongDb?sslMode=REQUIRED&allowPublicKeyRetrieval=true&useSSL=true
    username: root
    password: root
  jpa:
    hibernate:
      ddl-auto: update
      naming:
        physical-strategy: com.cambiazo.ong.shared.infrastructure.strategy.SnakeCaseWithPluralizedTablePhysicalNamingStrategy
    database: mysql
    database-platform: org.hibernate.dialect.MySQL8Dialect
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true


eureka:
  instance:
    hostname: localhost
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
